<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>并行工作台 · ParallelDev Workbench</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">并</div>
      <div class="brand-text">
        <b>并行工作台</b>
        <span>ParallelDev Workbench</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="home"><span class="nav-ico">◧</span>总览</button>
      <button class="nav-item" data-view="projects"><span class="nav-ico">▦</span>项目</button>
      <button class="nav-item" data-view="tasks"><span class="nav-ico">☑</span>任务</button>
      <button class="nav-item" data-view="board"><span class="nav-ico">▤</span>看板</button>
      <button class="nav-item" data-view="stats"><span class="nav-ico">◔</span>统计</button>
      <button class="nav-item" data-view="settings"><span class="nav-ico">⚙</span>设置</button>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-primary btn-block" id="btnQuickNew">＋ 新建任务 <kbd>N</kbd></button>
      <div class="kbd-hint">N 新建 · Esc 关闭 · Ctrl+1~6 切换视图</div>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-title" id="topbarTitle">总览</div>
      <div class="topbar-right">
        <button id="timerChip" class="timer-chip" hidden title="点击跳转到计时任务">
          <span class="timer-chip-time">00:00</span>
          <span class="timer-chip-title"></span>
        </button>
        <div class="search-wrap">
          <input type="text" id="globalSearch" placeholder="搜索任务 / 项目…">
        </div>
        <button class="btn btn-ghost" id="btnToggleDark" title="切换主题">◐</button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<!-- 通用模态 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<div id="toastWrap"></div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
